name: Windows tests and EXE build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out approved source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Validate version and release tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/v$version") {
            throw 'Release tag must match VERSION exactly'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install pinned application and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run source tests with real Tk and temporary PDFs
        shell: pwsh
        run: |
          # Avoid the runner user's 8.3 TEMP alias; keep path checks comparable.
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          python -m unittest discover -s tests -v
      - name: Build external updater and embedded Single, CLI, Portable identities
        run: python scripts/build_windows.py
      - name: Check frozen program and bundled resources
        run: python scripts/smoke_binaries.py
      - name: Package source, licenses, EXEs, managed files and update manifests
        run: python scripts/package_release.py
      - name: Verify real frozen renamed/moved updates, health checks and rollback
        run: python scripts/test_frozen_updates.py
      - name: Preserve frozen update failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-update-diagnostics-${{ github.run_id }}
          path: build/frozen_*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test build for local review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDF_Bookmarks_v${{ steps.version.outputs.version }}_win_x64_${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    needs: build
    # Release only a version tag pushed after the user confirms testing.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download tested Windows build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: PDF_Bookmarks_v${{ needs.build.outputs.version }}_win_x64_${{ github.run_number }}
          path: artifacts
      - name: Check downloaded asset hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "PDF_Bookmarks_v$env:RELEASE_VERSION" + '_win_x64'
          $expected = @("$prefix.exe", "${prefix}_cli.exe", "${prefix}_full.zip", "${prefix}_portable.zip", 'update-manifest.json')
          $checked = @()
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$') { throw 'Invalid checksum row' }
            $hash = $Matches[1]
            $file = $Matches[2]
            if ($expected -notcontains $file) { throw "Unexpected asset $file" }
            $actual = (Get-FileHash -LiteralPath (Join-Path artifacts $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "Checksum mismatch for $file" }
            $checked += $file
          }
          if ($checked.Count -ne $expected.Count -or ($checked | Sort-Object -Unique).Count -ne $expected.Count) { throw 'Missing or duplicated asset checksum' }
          $manifest = Get-Content artifacts/update-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_VERSION -or $manifest.app_id -ne 'com.linzh.PDFBookmarks' -or $manifest.schema -ne 1 -or $manifest.channel -ne 'stable') { throw 'Invalid release manifest identity' }
          foreach ($variant in @('single', 'portable')) {
            $asset = $manifest.assets.$variant
            if ($expected -notcontains $asset.file) { throw 'Missing update variant' }
            $file = Join-Path artifacts $asset.file
            if ((Get-Item -LiteralPath $file).Length -ne $asset.size -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'Update manifest asset mismatch' }
          }
          $portable = "$prefix" + '_portable.zip'
          $portableRow = Get-Content (Join-Path artifacts "$portable.sha256") -Raw
          $portableHash = (Get-FileHash -LiteralPath (Join-Path artifacts $portable) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableRow.Trim() -ne "$portableHash  $portable") { throw 'Portable checksum mismatch' }
          $allExpected = @($expected) + @('SHA256SUMS.txt', "$portable.sha256")
          $actualFiles = @(Get-ChildItem artifacts -File | ForEach-Object { $_.Name })
          if (@(Compare-Object ($allExpected | Sort-Object) ($actualFiles | Sort-Object)).Count -ne 0) { throw 'Release has unexpected or missing files' }
      - name: Publish approved version without replacing an existing release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; it will not be overwritten" }
          # Use the reviewed, version-specific notes bundled with these assets.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fullPackage = Join-Path artifacts "PDF_Bookmarks_${tag}_win_x64_full.zip"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($fullPackage)
          try {
            $entry = $archive.GetEntry('PDF_Bookmarks/docs/RELEASE_NOTES.md')
            if ($null -eq $entry) { throw 'Complete package is missing release notes' }
            $reader = [System.IO.StreamReader]::new($entry.Open(), [System.Text.Encoding]::UTF8)
            try { $notes = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $archive.Dispose() }
          if ($notes -notmatch ('\A# ' + [regex]::Escape($tag) + '(\r?\n|$)')) {
            throw 'Release notes version does not match the release tag'
          }
          $notesPath = Join-Path $env:RUNNER_TEMP release-notes.md
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          $arguments = @('release', 'create', $tag, '--draft', '--title', $tag, '--notes-file', $notesPath)
          $arguments += '--verify-tag'
          gh @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; the release remains a draft' }
          $published = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify uploaded release assets; remains draft' }
          $localFiles = @(Get-ChildItem artifacts -File)
          if ($published.assets.Count -ne $localFiles.Count) { throw 'Incomplete release remains draft' }
          foreach ($localFile in $localFiles) {
            $uploaded = @($published.assets | Where-Object { $_.name -eq $localFile.Name })
            if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne $localFile.Length) { throw "Invalid uploaded asset $($localFile.Name); remains draft" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
